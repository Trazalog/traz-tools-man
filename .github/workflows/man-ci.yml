# CI mínimo de la migración de AssetPlanner a MAN (MIG-0, punto 4).
# Fuente: traz-tools doc/migracion/MIGRACION-ASSETPLANNER.md §3.4 (niveles 0 y 0b).
#
# Cuidado del consumo de GitHub Actions (cuenta free, PM 2026-10-27):
# - Un solo job: cada job se cobra redondeado al minuto, aunque dure segundos.
# - Solo en pull_request: el push a develop-v3 llega siempre por un PR ya verificado.
# - Solo si cambian .php, el checklist o este workflow (un PR de docs no corre nada).
# - Un push nuevo al mismo PR cancela la corrida anterior.
name: man-ci

on:
  pull_request:
    branches: [develop-v3]
    paths:
      - '**.php'
      - '.ci/**'
      - '.github/workflows/man-ci.yml'

concurrency:
  group: man-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  man-ci:
    name: man-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checklist de conversión 0b
        run: bash .ci/checklist-0b.sh

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact -v -s .

      - name: PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          tools: none
      - name: php -l (PHP 5.6)
        run: |
          fallas=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || fallas=1
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $fallas

      - name: PHP 8.1 para phpcs
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
      - name: phpcs PHPCompatibility 5.6
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --quiet \
            squizlabs/php_codesniffer:^3.13 \
            phpcompatibility/php-compatibility:^9.3 \
            dealerdirect/phpcodesniffer-composer-installer:^1.0
          "$(composer global config bin-dir --absolute)/phpcs" -p . \
            --standard=PHPCompatibility --runtime-set testVersion 5.6 --extensions=php
